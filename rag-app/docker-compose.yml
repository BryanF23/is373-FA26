services:
  db:
    image: pgvector/pgvector:pg16
    container_name: xrlab-rag-db
    environment:
      POSTGRES_DB: xrlab
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports:
      - "5433:5432"
    volumes:
      - xrlab_rag_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d xrlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xrlab_rag_data:
